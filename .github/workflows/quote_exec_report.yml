name: quote-exec-report

on:
  schedule:
    # cron jobs scheduled on :00 under load.
    - cron: "15 19 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scripts        # <-- folder holding the script

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install dune-client pandas matplotlib requests

      - name: Run report
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEYY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python quote_exec_report.py

      - name: Upload chart artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-exec-chart
          path: scripts/quote_exec_combined.png    # <-- full path from repo root
          retention-days: 14
