name: Frontend Volumes Daily Report

on:
  schedule:
    # Run at 13:00 UTC daily
    - cron: '0 13 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write   # lets the job push the report image to the frontend-report-charts branch
  actions: read     # lets the duplicate guard list this workflow's runs

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Schedule runs often start hours after 13:00 UTC. A manual dispatch around
      # 15:30 UTC must win: a later schedule for that same report day does no work.
      - name: Guard scheduled run against a duplicate report
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "Proceeding: trigger is '${EVENT_NAME}'. The duplicate guard applies only to schedule runs, so this run is not blocked."
            echo "::notice title=Duplicate guard::Proceeding. Trigger ${EVENT_NAME} is never blocked."
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Report day is the half-open window [latest 13:00 UTC at or before this
          # run's start, next 13:00 UTC). 02:00 UTC still belongs to the previous
          # 13:00 window. A start of exactly 13:00:00 UTC opens the new window.
          now_epoch=$(date -u +%s)
          utc_date=$(date -u -d "@${now_epoch}" +%Y-%m-%d)
          today_13=$(date -u -d "${utc_date} 13:00:00 UTC" +%s)
          if [ "${now_epoch}" -ge "${today_13}" ]; then
            window_start_epoch=${today_13}
          else
            window_start_epoch=$((today_13 - 86400))
          fi
          window_end_epoch=$((window_start_epoch + 86400))
          window_start=$(date -u -d "@${window_start_epoch}" +%Y-%m-%dT%H:%M:%SZ)
          window_end=$(date -u -d "@${window_end_epoch}" +%Y-%m-%dT%H:%M:%SZ)
          started_at=$(date -u -d "@${now_epoch}" +%Y-%m-%dT%H:%M:%SZ)

          echo "Scheduled run ${GITHUB_RUN_ID} started at ${started_at}."
          echo "Report day window: [${window_start}, ${window_end})."

          if ! pages=$(gh api --paginate --slurp --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f per_page=100 \
            -f "created=>=${window_start}" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/frontend_volumes_report.yml/runs"); then
            echo "Failed to list workflow runs for the duplicate guard. Stopping without running the script or posting, so a second report cannot be sent. Dispatch the workflow manually if this report day still needs a post."
            exit 1
          fi

          # Queued / in-progress runs may still post. waiting, pending, and requested
          # are the other non-terminal states. Failed, cancelled, skipped, and
          # timed-out runs did not publish, so they do not block this one.
          classified=$(jq \
            --argjson start "${window_start_epoch}" \
            --argjson end "${window_end_epoch}" \
            --arg self "${GITHUB_RUN_ID}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            '
            def epoch:
              sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601;
            def blocking:
              .status == "queued"
              or .status == "in_progress"
              or .status == "waiting"
              or .status == "pending"
              or .status == "requested"
              or (.status == "completed" and .conclusion == "success");
            def row:
              {
                id,
                url: (.html_url // "https://github.com/\($repo)/actions/runs/\(.id)"),
                event,
                status,
                conclusion: (.conclusion // "none"),
                created_at
              };
            (if type == "array" then . else [.] end) as $pages
            | (
                [
                  $pages[].workflow_runs[]?
                  | select((.id | tostring) != $self)
                  | (.created_at | epoch) as $t
                  | select($t >= $start and $t < $end)
                ]
                | unique_by(.id)
              ) as $others
            | {
                blocking: [$others[] | select(blocking) | row] | sort_by(.created_at),
                ignored: [$others[] | select(blocking | not) | row] | sort_by(.created_at)
              }
            ' <<< "${pages}")

          blocking_count=$(jq '.blocking | length' <<< "${classified}")
          ignored_count=$(jq '.ignored | length' <<< "${classified}")

          if [ "${ignored_count}" -gt 0 ]; then
            echo "Not blocking on ${ignored_count} earlier run(s) in this window (they are not queued, in progress, or successful):"
            jq -r '.ignored[] | "  run \(.id) (\(.url)) event=\(.event) status=\(.status) conclusion=\(.conclusion) created_at=\(.created_at)"' <<< "${classified}"
          fi

          if [ "${blocking_count}" -gt 0 ]; then
            echo "Skipping: report day [${window_start}, ${window_end}) already has ${blocking_count} other queued, in-progress, or successful run(s). The script will not run and nothing will be posted."
            jq -r '.blocking[] | "  blocking run \(.id) (\(.url)) event=\(.event) status=\(.status) conclusion=\(.conclusion) created_at=\(.created_at)"' <<< "${classified}"
            notice=$(jq -r '[.blocking[] | "run \(.id) \(.url)"] | join("; ")' <<< "${classified}")
            echo "::notice title=Duplicate report skipped::${notice}"
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Proceeding: no other queued, in-progress, or successful run in report day [${window_start}, ${window_end})."
          echo "::notice title=Duplicate guard::Proceeding. No covering run in ${window_start} .. ${window_end}."
          echo "proceed=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install matplotlib numpy

      - name: Run frontend volumes script
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        env:
          DUNE_API_KEY_FRONTEND: ${{ secrets.DUNE_API_KEY_FRONTEND }}
          SLACK_WEBHOOK_FRONTEND: ${{ secrets.SLACK_WEBHOOK_FRONTEND }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u frontend_volumes.py

      - name: Save the report image
        if: ${{ steps.guard.outputs.proceed == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-report
          path: charts/frontend_report.png
          retention-days: 7
          if-no-files-found: ignore
